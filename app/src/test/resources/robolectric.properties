# compileSdk 37 is not supported by Robolectric and SDK 36 requires a Java 21 toolchain
# (the project builds with Java 17), so run against SDK 35.
sdk=35

# Robolectric defaults to a 320x470dp display; match a Pixel-sized phone so
# fields in scrollable forms are on-screen like they are on the managed device.
qualifiers=w412dp-h915dp-420dpi


